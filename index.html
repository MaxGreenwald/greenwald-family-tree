<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenwald Family Tree</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f8f9fa;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}
#container {
  width: 100vw;
  height: 100vh;
  cursor: grab;
  overflow: hidden;
  position: relative;
}
#container.dragging { cursor: grabbing; }
#tree {
  position: absolute;
  transform-origin: 0 0;
}
svg {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  overflow: visible;
}
svg line, svg path {
  stroke-width: 2;
  fill: none;
}
.person {
  position: absolute;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s;
  z-index: 2;
}
.person:hover { transform: scale(1.1); z-index: 10; }
.person .circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.5px;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.person .circle.you {
  width: 56px;
  height: 56px;
  font-size: 13px;
  border: 4px solid gold;
  box-shadow: 0 0 12px rgba(255,215,0,0.5);
}
.person .name {
  font-size: 9px;
  font-weight: 600;
  margin-top: 3px;
  line-height: 1.2;
  max-width: 90px;
  word-wrap: break-word;
  color: #333;
}
.person .rel {
  font-size: 7.5px;
  color: #e74c3c;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-top: 1px;
}
/* Branch colors */
.branch-greenwald .circle { background: #2c5aa0; }
.branch-weinhaus .circle { background: #3a7bd5; }
.branch-gervitz .circle { background: #8b1a4a; }
.branch-kapstein .circle { background: #8b1a4a; }
.branch-eisenberg .circle { background: #8b1a4a; }
.branch-hoffman .circle { background: #d35400; }
.branch-tolarsky .circle { background: #c0392b; }
.branch-reeves .circle { background: #c0392b; }
.branch-cohens .circle { background: #a93226; }
.branch-center .circle { background: #27ae60; }
.branch-bloom .circle { background: #c0392b; }
.branch-gerald .circle { background: #27ae60; }

/* Controls */
#controls {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#controls button {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 8px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#controls button:hover { background: #f0f0f0; }

#legend {
  position: fixed;
  bottom: 15px;
  left: 15px;
  z-index: 100;
  background: white;
  border-radius: 10px;
  padding: 12px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  font-size: 11px;
}
#legend h3 { font-size: 13px; margin-bottom: 8px; color: #333; }
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.legend-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
}

#title {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 100;
  background: white;
  border-radius: 10px;
  padding: 12px 18px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}
#title h1 { font-size: 18px; color: #333; }
#title p { font-size: 11px; color: #888; margin-top: 3px; }

#tooltip {
  position: fixed;
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12px;
  pointer-events: none;
  z-index: 200;
  display: none;
  max-width: 200px;
  line-height: 1.4;
}

#minimap {
  position: fixed;
  bottom: 15px;
  right: 15px;
  z-index: 100;
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  padding: 8px;
}
#minimap canvas {
  border-radius: 6px;
}
</style>

// ===== RENDERING =====
const tree = document.getElementById('tree');
const svgNS = 'http://www.w3.org/2000/svg';

console.log('People count:', Object.keys(PEOPLE).length, 'Positioned:', Object.keys(positions).length);
const unpositioned = Object.keys(PEOPLE).filter(id => !positions[id]);
if (unpositioned.length) console.warn('Unpositioned people:', unpositioned.map(id => PEOPLE[id].name));

// Calculate bounds
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
Object.values(positions).forEach(p => {
  minX = Math.min(minX, p.x - 50);
  maxX = Math.max(maxX, p.x + 50);
  minY = Math.min(minY, p.y - 40);
  maxY = Math.max(maxY, p.y + 80);
});

const treeWidth = maxX - minX + 200;
const treeHeight = maxY - minY + 200;
console.log('Tree dimensions:', treeWidth, 'x', treeHeight, 'Bounds:', minX, maxX, minY, maxY);
tree.style.width = treeWidth + 'px';
tree.style.height = treeHeight + 'px';

// Create SVG for lines

svg.setAttribute('width', treeWidth);
svg.setAttribute('height', treeHeight);
svg.style.width = treeWidth + 'px';
svg.style.height = treeHeight + 'px';
tree.appendChild(svg);

// Offset all positions so tree starts at 0,0
const offsetX = -minX + 100;
const offsetY = -minY + 100;
Object.keys(positions).forEach(id => {
  positions[id].x += offsetX;
  positions[id].y += offsetY;
});

// Branch colors for lines
const branchColors = {
  greenwald: '#2c5aa0',
  weinhaus: '#3a7bd5',
  gervitz: '#8b1a4a',
  kapstein: '#8b1a4a',
  eisenberg: '#8b1a4a',
  hoffman: '#d35400',
  tolarsky: '#c0392b',
  reeves: '#c0392b',
  cohens: '#a93226',
  center: '#27ae60',
  bloom: '#c0392b',
  gerald: '#27ae60',
};

// Draw connections using standard family tree pattern:
// 1. Horizontal couple line
// 2. Vertical drop from couple midpoint
// 3. Horizontal sibling bar
// 4. Vertical drops to each child
COUPLES.forEach(([p1, p2, children]) => {
  const pos1 = positions[p1];
  if (!pos1) return;
  const branch = PEOPLE[p1]?.branch || 'center';
  const color = branchColors[branch] || '#999';
  // The .person div is NODE_WIDTH (120px) wide; the 44px circle is centered
  // via margin:0 auto, so circle center = x + NODE_WIDTH/2, y + 22
  const cx = NODE_WIDTH / 2; // 60 - horizontal center of circle within div
  const cy = 22;             // vertical center of circle (44/2)
  const circleBottom = 44;   // bottom edge of circle

  // Couple line (horizontal bar between partners)
  if (p2 && positions[p2]) {
    const pos2 = positions[p2];
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', pos1.x + cx);
    line.setAttribute('y1', pos1.y + cy);
    line.setAttribute('x2', pos2.x + cx);
    line.setAttribute('y2', pos2.y + cy);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-opacity', '0.6');
    line.setAttribute('stroke-width', '2.5');
    svg.appendChild(line);
  }

  // Parent to children lines
  const validChildren = (children || []).filter(cid => positions[cid]);
  if (validChildren.length === 0) return;

  const coupleX = p2 && positions[p2]
    ? (pos1.x + positions[p2].x) / 2 + cx
    : pos1.x + cx;
  const coupleY = pos1.y + circleBottom; // drop from bottom of circle

  // Find the topmost child to determine the sibling bar Y
  const childPositions = validChildren.map(cid => ({
    id: cid,
    x: positions[cid].x + cx,   // center of child circle
    y: positions[cid].y          // top of child circle
  }));
  const minChildY = Math.min(...childPositions.map(c => c.y));
  const barY = coupleY + (minChildY - coupleY) * 0.45; // sibling bar at 45% down

  // Vertical line from couple down to sibling bar
  const drawLine = (x1, y1, x2, y2) => {
    const l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', color);
    l.setAttribute('stroke-opacity', '0.45');
    l.setAttribute('stroke-width', '2');
    svg.appendChild(l);
  };

  drawLine(coupleX, coupleY, coupleX, barY);

  if (validChildren.length === 1) {
    // Single child - just draw straight down
    const c = childPositions[0];
    drawLine(coupleX, barY, c.x, barY);
    drawLine(c.x, barY, c.x, c.y);
  } else {
    // Multiple children - draw sibling bar
    const leftX = Math.min(...childPositions.map(c => c.x));
    const rightX = Math.max(...childPositions.map(c => c.x));
    drawLine(leftX, barY, rightX, barY);

    // Drop lines from bar to each child
    childPositions.forEach(c => {
      drawLine(c.x, barY, c.x, c.y);
    });
  }
});

    tooltip.style.display = 'none';

});

// ===== PAN & ZOOM =====
let scale = 0.2;
let panX = 0, panY = 0;
let isDragging = false;
let startX, startY;
const container = document.getElementById('container');

function updateTransform() {
  tree.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

// Center on Max initially
function resetView() {
  const maxPos = positions['max'];
  scale = 0.2;
  panX = window.innerWidth / 2 - maxPos.x * scale;
  panY = window.innerHeight * 0.7 - maxPos.y * scale;
  updateTransform();
}

resetView();

container.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  container.classList.add('dragging');
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  updateTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  container.classList.remove('dragging');
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.max(0.08, Math.min(2, scale * zoomFactor));
  const rect = container.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  panX = mouseX - (mouseX - panX) * (newScale / scale);
  panY = mouseY - (mouseY - panY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, { passive: false });

// Touch support
let lastTouchDist = 0;
container.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - panX;
    startY = e.touches[0].clientY - panY;
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});

container.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    panX = e.touches[0].clientX - startX;
    panY = e.touches[0].clientY - startY;
    updateTransform();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const zoomFactor = dist / lastTouchDist;
    scale = Math.max(0.08, Math.min(2, scale * zoomFactor));
    lastTouchDist = dist;
    updateTransform();
  }
}, { passive: false });

container.addEventListener('touchend', () => { isDragging = false; });

function zoomIn() { scale = Math.min(2, scale * 1.2); updateTransform(); }
function zoomOut() { scale = Math.max(0.08, scale / 1.2); updateTransform(); }
